name: release

on:
  push:
    tags: ['v*.*.*']
  # Pushing more than three tags at once makes GitHub drop the tag events
  # past the third, and a release can also fail for reasons that have
  # nothing to do with the tag. So it can be started by hand too — run it
  # against the TAG, not a branch: the checkout, the notes and goreleaser
  # all read the same ref.
  workflow_dispatch:

# Read by default; the one job that publishes raises what it needs.
permissions:
  contents: read

# Every `run` step in this file. An explicit bash also turns on pipefail,
# so a failure in the left half of a pipe stops the step.
defaults:
  run:
    shell: bash

jobs:
  # A tag is only a pointer, and nothing stops one landing on a commit
  # whose CI never ran or ran red. Everything below publishes somewhere
  # irreversible, so require a green `ci` run for THIS commit first.
  verify-ci:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - name: Require a successful ci run for this commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          conclusion=$(gh api \
            "repos/${REPO}/actions/workflows/ci.yml/runs?head_sha=${SHA}&status=completed" \
            --jq '[.workflow_runs[] | select(.conclusion != null)][0].conclusion // "none"')
          echo "ci conclusion for ${SHA}: ${conclusion}"
          if [ "${conclusion}" != "success" ]; then
            echo "::error::Refusing to release ${SHA}: ci is '${conclusion}', not 'success'." \
                 "Push the tag only after ci passes on this commit."
            exit 1
          fi

  goreleaser:
    needs: verify-ci
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      # Keyless signing and build provenance both prove who built these
      # artifacts, and both need an OIDC token to do it.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          # goreleaser reads tags, and a shallow clone has none.
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod

      # ci already ran this on three platforms for this commit. A minute
      # here closes the gap between "ci was green" and "these are the
      # bytes being signed".
      - run: go test ./...

      # The CHANGELOG entry is the release note, written for the person
      # deciding whether to upgrade. Notes generated from commit subjects
      # would tell them about our commit hygiene instead.
      #
      # Written OUTSIDE the checkout deliberately: goreleaser refuses to
      # release from a dirty tree, and an untracked file in the working
      # directory is dirty — `release --clean` empties dist/ and has
      # nothing to say about anything else. `--snapshot` skips that check
      # entirely, so no rehearsal can find this and the first tag is the
      # first time it fails.
      - name: Release notes from the CHANGELOG
        env:
          REF_NAME: ${{ github.ref_name }}
        run: go run ./scripts/gates release-notes "${REF_NAME}" > "${RUNNER_TEMP}/release-notes.md"

      # Pinning an action does not pin what the action INSTALLS. Both of
      # these fetch a tool, and without a version they fetch whatever is
      # current that morning: a half-pinned step that reads exactly like
      # a pinned one, and a green build that cannot be reproduced
      # tomorrow. `make pins` holds both halves.
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2
        with:
          cosign-release: v3.1.3
      - uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26  # v0.24.2
        with:
          syft-version: v1.51.1

      # Same rule: the action is pinned, so the goreleaser it runs is
      # pinned too. "~> v2" would float within the major version.
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94  # v7.2.3
        with:
          version: v2.18.1
          args: release --clean --release-notes=${{ runner.temp }}/release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Provenance ties every published file to this workflow, this
      # commit and this runner, checkable from outside with
      # `gh attestation verify`. The bundle and the checksum file are
      # subjects too: the bundle is what most people actually install.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: "dist/*.tar.gz,dist/*.zip,dist/*.mcpb,dist/checksums.txt"

      # The MCP registry entry, last because the registry does a HEAD on
      # the bundle's download URL before it accepts one: the release has
      # to exist first. The hash comes from the release's own
      # checksums.txt, because a client verifies the bundle before
      # installing it and the registry requires it for an MCPB package —
      # which is also why this is not goreleaser's `mcp` block, whose
      # package entry has nowhere to put a hash.
      #
      # A prerelease rehearses the pipeline and must NOT rehearse the
      # registry: an entry cannot be taken back, so v1.0.0-rc1 would
      # leave a permanent row pointing at a bundle nobody should install.
      # The test is goreleaser's own for `prerelease: auto` — a hyphen in
      # the tag.
      - name: Registry entry from the release's own checksums
        if: ${{ !contains(github.ref_name, '-') }}
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          go run ./scripts/gates server-json "${REF_NAME}" dist/checksums.txt > dist/server.json
          cat dist/server.json

      # Verified before it runs, for the same reason the tools above are
      # pinned — and more so: this job holds an identity that can publish
      # under io.github.mmedum, so an unverified binary here would be
      # handed exactly that.
      - name: Install mcp-publisher
        if: ${{ !contains(github.ref_name, '-') }}
        env:
          PUBLISHER: v1.8.1
          BASE: https://github.com/modelcontextprotocol/registry/releases/download
        run: |
          set -euo pipefail
          asset=mcp-publisher_linux_amd64.tar.gz
          curl -fsSL -O "${BASE}/${PUBLISHER}/${asset}"
          curl -fsSL -O "${BASE}/${PUBLISHER}/${asset}.sigstore.json"
          cosign verify-blob "${asset}" \
            --bundle "${asset}.sigstore.json" \
            --certificate-identity \
              "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${PUBLISHER}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
          tar xzf "${asset}" mcp-publisher

      - name: Publish to the MCP registry
        if: ${{ !contains(github.ref_name, '-') }}
        run: |
          set -euo pipefail
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish dist/server.json
